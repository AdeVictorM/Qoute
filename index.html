<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quote Generator</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="page">
    <div class="card">
      <span class="quote-mark" aria-hidden="true">&ldquo;</span>

      <blockquote class="quote" id="quoteBlock">
        <p class="quote__text" id="quoteText"></p>
        <footer class="quote__author">&mdash; <span id="quoteAuthor"></span></footer>
      </blockquote>

      <div class="categories" id="categoryRow"></div>

      <div class="actions">
        <button type="button" class="btn btn--primary" id="newQuoteBtn">New Quote</button>
        <div class="icon-actions">
          <button type="button" class="icon-btn" id="favoriteBtn" aria-label="Save to favorites" aria-pressed="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.35-9.5-8.5C.8 8.1 2.3 4.5 6 4c2-.27 3.5.8 4.5 2.1 1-1.3 2.5-2.37 4.5-2.1 3.7.5 5.2 4.1 3.5 7.5C19 15.65 12 20 12 20z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-btn" id="copyBtn" aria-label="Copy quote">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button type="button" class="icon-btn" id="shareBtn" aria-label="Share on X">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 3h3l-7.5 8.6L22 21h-6.6l-5.2-6.6L4 21H1l8-9.2L2 3h6.8l4.7 6 4.5-6z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <span class="toast" id="toast" hidden>Copied to clipboard</span>
    </div>

    <button type="button" class="favorites-toggle" id="favoritesToggle">
      View favorites <span id="favoritesCount">(0)</span>
    </button>

    <section class="favorites" id="favoritesSection" hidden>
      <h2 class="favorites__title">Favorites</h2>
      <ul class="favorites__list" id="favoritesList"></ul>
      <p class="favorites__empty" id="favoritesEmpty" hidden>No favorites saved yet.</p>
    </section>

    <p class="hint">Space or N for a new quote</p>
  </main>

  <script src="js/quotes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
